stages:
  - publish

publish:
  image: node:22
  stage: publish
  only:
    - tags
  script:
    # Install dependencies, test and build
    - npm ci
    - npm test
    - npm run build
    # Auth and publish to NPM
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish --access=public
